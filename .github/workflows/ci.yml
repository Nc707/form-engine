name: CI

on:
  push:
    branches: [main, 'feat-**', 'p*-**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          # Caches ~/.m2/repository, keyed on the checked-in pom.xml files.
          cache: maven

      # The default build deliberately skips the Vaadin `production` profile: only that profile
      # binds vaadin-maven-plugin's build-frontend goal, which downloads a Node toolchain and runs
      # a Vite build. Adding -Pproduction here means also caching ~/.vaadin and
      # form-engine-demo/node_modules, or CI gets slow and network-flaky for no benefit — the REST
      # module and every test live outside the demo.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7
