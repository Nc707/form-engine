server.port=${PORT:8081}
logging.level.org.atmosphere=warn
logging.level.com.nc.formengine=DEBUG

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.nc.formengine

# In-memory database. The schema is derived from the JPA entities on startup; this is a
# demo application and the data is intentionally not durable across restarts.
spring.datasource.url=jdbc:h2:mem:formengine;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
