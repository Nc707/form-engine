# `docker compose up` is the whole setup: it builds the demo from source and serves it. Nothing
# here needs to exist on the host — no JDK, no Maven, no Node.

# Named explicitly, because Compose otherwise derives the project name from the directory. That is
# whatever the repository happens to be cloned into — in a git worktree it is commonly "main" — and
# two unrelated stacks sharing a directory name share containers, networks and orphan warnings.
name: form-engine

services:
  app:
    build: .
    image: form-engine-demo:local
    ports:
      # The demo reads server.port=${PORT:8081}, so the container listens on 8081.
      - "8081:8081"
    environment:
      # In-memory here would mean `docker compose down` is indistinguishable from deleting
      # everything ever entered through the container, which is not what stopping a container
      # means anywhere else. application.properties keeps the in-memory database for
      # `mvn spring-boot:run`, where the JVM process itself is the unit of "stopped"; only this
      # override, which nothing outside Docker sees, switches to a file so the volume below has
      # something durable to hold.
      SPRING_DATASOURCE_URL: jdbc:h2:file:/home/formengine/data/formengine
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    volumes:
      - form-engine-data:/home/formengine/data

# Named rather than bound to a host path: the data belongs to this stack, not to wherever the repo
# happens to be checked out, and a named volume survives `docker compose down` the same way a
# database server's own storage would. `docker compose down -v` (or deleting the volume by hand)
# is the actual reset, back to only the seeded forms.
volumes:
  form-engine-data:
